name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Configure the four Android signing secrets described in RELEASES.md before publishing."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/imd-tv-release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/imd-tv-release.jks"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              value = value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r")
              value = value.replace(":", "\\:").replace("=", "\\=")
              if value.startswith((" ", "#", "!")):
                  value = "\\" + value
              return value

          values = {
              "storeFile": os.environ["KEYSTORE_FILE"],
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "keystore.properties"
          path.write_text("".join(f"{key}={escape(value)}\n" for key, value in values.items()))
          path.chmod(0o600)
          PY

      - name: Build signed standard APK
        env:
          IPTV_KEYSTORE_PROPERTIES: ${{ runner.temp }}/keystore.properties
        run: ./gradlew :app:assembleStandardRelease

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/standard/release/app-standard-release.apk release-assets/imd-tv.apk
          cd release-assets
          sha256sum imd-tv.apk > imd-tv.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/imd-tv.apk
            release-assets/imd-tv.apk.sha256
          fail_on_unmatched_files: true
